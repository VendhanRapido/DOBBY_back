name: CI — Autogen Tests with Cursor Agent

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Cursor Agent
        run: |
          curl -fsS https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Export Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "Missing CURSOR_API_KEY secret."
            exit 1
          fi

      - name: Find changed Go files
        id: changed
        run: |
          git fetch origin develop
          CHANGED=$(git diff --name-only origin/develop...HEAD \
            | grep '\.go$' \
            | grep -v '_test.go' \
            | grep -v '_mock.go' \
            | sort -u || true)

          echo "Changed Go files detected:"
          echo "$CHANGED"

          # Trim trailing newlines and write to output cleanly
          {
            echo "changed_files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"



      - name: Generate tests for changed files
        if: steps.changed.outputs.changed_files != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "Changed files:"
          echo "${{ steps.changed.outputs.changed_files }}" | cat -A  # Debug print to visualize

          # Process unique, non-empty lines
          echo "${{ steps.changed.outputs.changed_files }}" \
          | awk '!seen[$0]++ && NF' \
          | while read -r file; do
              echo "Generating tests for: $file"
              scripts/generate_tests_for_file.sh "$file"
            done


      - name: Run go test
        run: |
          go test ./... -v -cover

      - name: Commit generated files (if any)
        run: |
          git config --global user.email "cursor-bot@users.noreply.github.com"
          git config --global user.name "cursor-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No new tests to commit."
          else
            git commit -m "chore: auto-generate tests with cursor-agent"
            git push origin HEAD:${{ github.head_ref }}
          fi


