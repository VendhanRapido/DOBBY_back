name: CI — Autogen Tests with Cursor Agent

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Cursor Agent
        run: |
          curl -fsS https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Export Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "Missing CURSOR_API_KEY secret."
            exit 1
          fi

      - name: Find changed Go files
        id: changed
        run: |
          git fetch origin develop
          CHANGED=$(git diff --name-only origin/develop...HEAD | grep '\.go$' | grep -v '_test.go' | grep -v '_mock.go' || true)
          echo "Changed Go files detected:"
          echo "$CHANGED"
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate tests for changed files
        if: steps.changed.outputs.changed_files != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "📂 Files to process:"
          echo "${{ steps.changed.outputs.changed_files }}" | while IFS= read -r file; do
            file=$(echo "$file" | xargs)  # trim spaces
            if [[ -n "$file" ]]; then
              echo "Generating tests for: $file"
              scripts/generate_tests_for_file.sh "$file"
            fi
          done


      - name: Run go test
        run: |
          go test ./... -v -cover

      - name: Commit generated files to a new branch and create PR
        if: steps.changed.outputs.changed_files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "cursor-bot@users.noreply.github.com"
          git config --global user.name "cursor-bot"

          # Create a new branch from current HEAD
          BRANCH_NAME="autogen-tests/${GITHUB_SHA::8}"
          git checkout -b "$BRANCH_NAME"

          # Stage changes
          git add $(git ls-files | grep -E '(_test\.go|_mock\.go)$' || true)

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new tests to commit."
            exit 0
          fi

          git commit -m "chore: auto-generate tests with cursor-agent"

          # Push new branch
          git push origin "$BRANCH_NAME"

          # Create PR against the original PR target branch (develop)
          gh pr create \
            --title "chore: auto-generate tests" \
            --body "This PR adds/updates tests generated by Cursor Agent." \
            --base develop \
            --head "$BRANCH_NAME"
